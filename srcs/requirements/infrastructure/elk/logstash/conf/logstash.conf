# ==============================================================================
# Logstash Pipeline Configuration
# ==============================================================================
# Purpose: Collect Docker container logs and index them in Elasticsearch
# Module: #39 (ELK Stack for Log Management)
# ==============================================================================

input {
  # Read logs from Docker container JSON log files
  # Docker stores logs at: /var/lib/docker/containers/[container-id]/[container-id]-json.log

  file {
    # Path to Docker container logs
    path => "/var/lib/docker/containers/*/*.log"

    # Start reading from the beginning of files
    start_position => "beginning"

    # Read as JSON (Docker logs are in JSON format)
    codec => "json"

    # Tag as docker logs
    type => "docker"
  }
}

filter {
  # Parse JSON logs from containers
  if [type] == "docker" {

    # Extract service name from container name or labels
    if [container][name] {
      mutate {
        add_field => { "service" => "%{[container][name]}" }
      }
    }

    # Parse Fastify JSON logs (Pino format)
    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "log"
      }

      # Extract common fields from Pino logs
      if [log][level] {
        mutate {
          add_field => { "log_level" => "%{[log][level]}" }
        }
      }

      if [log][msg] {
        mutate {
          add_field => { "log_message" => "%{[log][msg]}" }
        }
      }

      if [log][service] {
        mutate {
          replace => { "service" => "%{[log][service]}" }
        }
      }

      if [log][time] {
        date {
          match => [ "[log][time]", "ISO8601" ]
          target => "@timestamp"
        }
      }
    }

    # Add timestamp if not present
    if ![timestamp] {
      mutate {
        add_field => { "timestamp" => "%{@timestamp}" }
      }
    }

    # Tag by service type for easier filtering in Kibana
    if [service] =~ /user-service/ {
      mutate { add_tag => ["user-service", "backend", "nodejs"] }
    }
    else if [service] =~ /game-service/ {
      mutate { add_tag => ["game-service", "backend", "nodejs"] }
    }
    else if [service] =~ /chat-service/ {
      mutate { add_tag => ["chat-service", "backend", "nodejs"] }
    }
    else if [service] =~ /frontend/ {
      mutate { add_tag => ["frontend", "nginx"] }
    }
    else {
      mutate { add_tag => ["infrastructure"] }
    }
  }
}

output {
  # Send all logs to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]

    # Index pattern: logs-YYYY.MM.DD
    # This allows for easy retention management (delete old indices)
    index => "logs-%{+YYYY.MM.dd}"

    # Document ID (optional, for deduplication)
    document_id => "%{[@metadata][docker][id]}-%{[@metadata][docker][stream]}"
  }

  # Debug output (useful for development)
  # Uncomment to see logs in Logstash console
  # stdout {
  #   codec => rubydebug
  # }
}

# ==============================================================================
# CONFIGURATION NOTES
# ==============================================================================
#
# Data Retention Policy (Module #39 Requirement):
#   - Logs are stored in daily indices (logs-YYYY.MM.DD)
#   - Manual retention: Delete old indices after 30-90 days
#   - Command: curl -X DELETE "localhost:9200/logs-2025.01.01"
#   - Or use Kibana Dev Tools: DELETE /logs-2025.01.01
#
# Index Pattern for Kibana:
#   - Create index pattern: logs-*
#   - Time field: @timestamp
#   - This allows Kibana to search across all daily indices
#
# Supported Log Formats:
#   - JSON logs (Pino from Fastify services) - PREFERRED
#   - Plain text logs (fallback)
#   - Docker container metadata (always included)
#
# Security (Module #39 Requirement):
#   - Docker network isolation (automatic)
#   - Elasticsearch has no public exposure (only via Kibana)
#   - Logstash reads Docker socket read-only
#
# ==============================================================================
