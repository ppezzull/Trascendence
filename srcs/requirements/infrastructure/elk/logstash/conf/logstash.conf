# ==============================================================================
# Logstash Pipeline Configuration - Dual Input (Docker + Nginx)
# ==============================================================================
# Purpose: Collect Docker container logs AND Nginx access logs
# Module: #39 (ELK Stack for Log Management)
# ==============================================================================

input {
  # Input 1: Docker container logs (existing)
  file {
    path => "/var/lib/docker/containers/*/*.log"
    start_position => "beginning"
    codec => "json"
    type => "docker"
  }

  # Input 2: Nginx access logs (NEW)
  file {
    path => "/var/log/nginx/access.log"
    type => "nginx_access"
    start_position => "beginning"
  }
}

filter {
  # Filter for Docker logs (KEEP EXISTING)
  if [type] == "docker" {
    if [container][name] {
      mutate {
        add_field => { "service" => "%{[container][name]}" }
      }
    }

    if [message] =~ /^\{.*\}$/ {
      json {
        source => "message"
        target => "log"
      }

      if [log][level] {
        mutate { add_field => { "log_level" => "%{[log][level]}" } }
      }

      if [log][msg] {
        mutate { add_field => { "log_message" => "%{[log][msg]}" } }
      }

      if [log][service] {
        mutate { replace => { "service" => "%{[log][service]}" } }
      }

      if [log][time] {
        date {
          match => [ "[log][time]", "ISO8601" ]
          target => "@timestamp"
        }
      }
    }

    if [service] =~ /user-service/ {
      mutate { add_tag => ["user-service", "backend", "nodejs"] }
    }
    else if [service] =~ /game-service/ {
      mutate { add_tag => ["game-service", "backend", "nodejs"] }
    }
    else if [service] =~ /chat-service/ {
      mutate { add_tag => ["chat-service", "backend", "nodejs"] }
    }
    else if [service] =~ /frontend/ {
      mutate { add_tag => ["frontend", "nginx"] }
    }
    else {
      mutate { add_tag => ["infrastructure"] }
    }
  }

  # Filter for Nginx access logs (NEW)
  if [type] == "nginx_access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }

    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }

    # Extract HTTP method and URL path
    grok {
      match => { "request" => "%{WORD:http_method} %{URIPATH:url_path}(?:\?%{NOTSPACE:query_string})? HTTP/%{NUMBER:http_version}" }
    }

    # Convert response code to integer
    mutate {
      convert => { "response" => "integer" }
      convert => { "bytes" => "integer" }
    }

    # Drop monitoring endpoints (prevent logging loop)
    if [url_path] =~ /^\/kibana/ { drop {} }
    if [url_path] =~ /^\/grafana/ { drop {} }
    if [url_path] =~ /^\/prometheus/ { drop {} }

    # Tag for filtering
    mutate {
      add_tag => ["nginx", "access_log", "http"]
      add_field => { "service" => "nginx" }
    }
  }
}

output {
  # Route to different indices based on log type
  if [type] == "nginx_access" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "nginx-logs-%{+YYYY.MM.dd}"
    }
  }

  if [type] == "docker" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "application-logs-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (optional, uncomment for troubleshooting)
  # stdout { codec => rubydebug }
}

# ==============================================================================
# CONFIGURATION NOTES
# ==============================================================================
#
# Data Retention Policy (Module #39 Requirement):
#   - Logs are stored in daily indices:
#     * nginx-logs-YYYY.MM.DD (Nginx access logs)
#     * application-logs-YYYY.MM.DD (Docker container logs)
#   - Manual retention: Delete old indices after 30-90 days
#   - Command: curl -X DELETE "localhost:9200/nginx-logs-2025.01.01"
#
# Index Patterns for Kibana:
#   1. nginx-logs-* (HTTP access logs for web analytics)
#   2. application-logs-* (Application container logs)
#
# Nginx Access Log Fields:
#   - clientip: Remote IP address
#   - http_method: GET, POST, PUT, DELETE, etc.
#   - url_path: URL path (e.g., /api/users)
#   - response: HTTP status code (200, 404, 500, etc.)
#   - bytes: Response size in bytes
#   - referrer: HTTP Referer header
#   - agent: User-Agent string
#
# Security (Module #39 Requirement):
#   - Docker network isolation (automatic)
#   - Elasticsearch has no public exposure (only via Kibana)
#   - Logstash reads Docker socket and nginx logs read-only
#
# ==============================================================================
